name: Bug 报告
description: 报告可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿提交 Token、App Secret、用户 ID、`.env`、`.runtime` 或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: Bridge 版本
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI 版本
    validations:
      required: true
  - type: input
    id: lark
    attributes:
      label: lark-cli 版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
